[project]
name = "variatio"
version = "1.174.21"
description = "Knowledge graph-guided generation of educational content variants"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "ollama>=0.4.7",
    "tqdm>=4.67.3",
    "json-repair>=0.59.5",
    "pydantic>=2.11.2",
]

# The runtime core above measures 57.4 MB in a clean venv, of which numpy is 44. It was 172.9
# until scipy left it on 2026-08-24: added by `1641d9b` with the embedding system and imported
# by nothing in the repository since — the whole 115 MB paid for an import that never happened.
# Docling still depends on it, so a `builders` install is unchanged; re-measure before adding
# anything back.
#
# Authoring-only. Docling drags ~700 MB (torch, transformers, opencv, rapidocr, scipy, pandas,
# docling-parse) that the runtime pipeline never touches; it is imported lazily in
# documents/files.py, behind a `LazyConverter` that resolves at the one point a
# converter is used — so a PDF corpus (page transcription) or a cached one never builds it.

[project.optional-dependencies]
# pypdfium2 and python-pptx arrive with Docling anyway, but `documents.page_images`
# imports the first to rasterise pages and `documents.office.speaker_notes` the second to
# read a deck's notes, so both are declared rather than relied on transitively.
builders = ["docling>=2.0.0", "pypdfium2>=4.30.0", "pillow>=10.0.0", "python-pptx>=1.0.0"]

# The web UI's backend. Kept out of the runtime so the CLI stays a plain library.

server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    # The evaluation's RAG arm reads the raw PDFs with a plain text extractor, deliberately not
    # the pipeline's VLM transcription: a baseline built without this system.
    "pypdf>=5.0.0",
    # An invitation's link is kept sealed (Fernet) so the panel can show it again, with a key
    # that never lives in the database: `server/auth/links.py`.
    "cryptography>=43.0.0",
]

# uv has no `default-extras`, so the extras are repeated here to keep a plain
# `uv sync` able to run the builders and the server locally.

[dependency-groups]
dev = [
    "docling>=2.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "python-pptx>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "pypdf>=5.0.0",
    "cryptography>=43.0.0",
    "pytest>=8.3.0",
    "import-linter>=2.1",
]

[project.scripts]
variatio = "variatio.cli:main"
system = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["variatio", "server", "consumers"]

[tool.pytest.ini_options]
addopts = "-m 'not corpus and not model'"
markers = [
    "corpus: measures the built corpus cache; run with -m corpus after rebuilding the graph",
    "model: measures a judge against a live Ollama; run with -m model, it costs ~20 calls",
]

# The import boundaries, checked by `uv run lint-imports`. Each exception is an import that
# exists today and is named here so that no new one grows; removing one is always welcome.
[tool.importlinter]
root_packages = ["variatio", "server", "consumers"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The library knows neither the server nor the functions"
type = "forbidden"
source_modules = ["variatio"]
forbidden_modules = ["server", "consumers"]
ignore_imports = [
    # Each function declares its settings beside the code that reads them; the registry
    # picks them up by an optional import.
    "variatio.settings.registry -> consumers.*.settings",
]

[[tool.importlinter.contracts]]
name = "The server names the functions only where it mounts them"
type = "forbidden"
source_modules = ["server"]
forbidden_modules = ["consumers"]
ignore_imports = [
    "variatio.settings.registry -> consumers.*.settings",
    # The composition root mounts every function.
    "server.app -> consumers.*.api",
    # Four reads of the evaluation older than `consumers/`.
    "server.pipeline.jobs -> consumers.evaluation.raw_text",
    "server.jobs.lanes -> consumers.evaluation.config",
    "server.raw.documents -> consumers.evaluation.raw_text",
    "server.routers.admin -> consumers.evaluation.api.store",
]

[[tool.importlinter.contracts]]
name = "The generation function imports no other function"
type = "forbidden"
source_modules = ["consumers.generation"]
forbidden_modules = ["consumers.evaluation", "consumers.tutor", "consumers.chat"]
# Direct imports only: each function reaches the server, and the server reaches the
# evaluation in its four named reads.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The evaluation function imports no other function"
type = "forbidden"
source_modules = ["consumers.evaluation"]
forbidden_modules = ["consumers.generation", "consumers.tutor", "consumers.chat"]
# Direct imports only: each function reaches the server, and the server reaches the
# evaluation in its four named reads.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The tutor function imports no other function"
type = "forbidden"
source_modules = ["consumers.tutor"]
forbidden_modules = ["consumers.generation", "consumers.evaluation", "consumers.chat"]
# Direct imports only: each function reaches the server, and the server reaches the
# evaluation in its four named reads.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The chat function imports no other function"
type = "forbidden"
source_modules = ["consumers.chat"]
forbidden_modules = ["consumers.generation", "consumers.evaluation", "consumers.tutor"]
# Direct imports only: each function reaches the server, and the server reaches the
# evaluation in its four named reads.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The library's layers"
type = "layers"
containers = ["variatio"]
layers = [
    "cli",
    "entrypoints",
    "builders | runtime",
    "loaders | documents",
    "prompts | wording",
    "core : settings : config",
]
ignore_imports = [
    "variatio.runtime.taggability -> variatio.builders.knowledge_graph_builder.blocks",
    "variatio.runtime.taggability -> variatio.builders.knowledge_graph_builder.parsing",
    "variatio.core.lexicon -> variatio.wording",
]

[[tool.importlinter.contracts]]
name = "Only the door and the work know what a workspace is"
type = "forbidden"
source_modules = ["variatio.runtime", "variatio.prompts", "variatio.wording", "variatio.settings"]
forbidden_modules = ["variatio.core.workspace"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The vocabulary and the door never import the engine boundary"
type = "forbidden"
source_modules = [
    "variatio.entrypoints",
    "variatio.loaders",
    "variatio.prompts",
    "variatio.wording",
    "variatio.settings",
]
forbidden_modules = ["variatio.core.inference"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the local engine imports the Ollama SDK"
type = "forbidden"
source_modules = ["variatio", "server", "consumers"]
forbidden_modules = ["ollama"]
ignore_imports = ["variatio.core.ollama -> ollama"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only server/routing.py imports a route module"
type = "protected"
protected_modules = [
    "server.routers.*",
    "server.core.routes.*",
    "server.auth.router",
    "server.workspaces.router",
    "server.pipeline.routes.*",
    "server.jobs.router",
    "server.raw.router",
    "server.kg.router",
]
# What one route module imports of another is the next contract's.
allowed_importers = [
    "server.routing",
    "server.routers.*",
    "server.core.routes.*",
    "server.auth.router",
    "server.workspaces.router",
    "server.pipeline.routes.*",
    "server.jobs.router",
    "server.raw.router",
    "server.kg.router",
]
ignore_imports = [
    # Routes used as libraries by the functions; they leave with the server's areas.
    "consumers.*.api.router -> server.routers.exercises",
    "consumers.generation.api.router -> server.routers.bank",
]

[[tool.importlinter.contracts]]
name = "The server's route modules do not import each other"
type = "independence"
modules = [
    "server.routers.*",
    "server.core.routes.*",
    "server.auth.router",
    "server.workspaces.router",
    "server.pipeline.routes.*",
    "server.jobs.router",
    "server.raw.router",
    "server.kg.router",
]

[[tool.importlinter.contracts]]
name = "The server's layers"
type = "layers"
containers = ["server"]
layers = [
    "__main__ : app : cli : routing",
    "routers",
    "kg | raw",
    "pipeline",
    "auth | workspaces",
    "conversations | generations",
    # The process's live queue is the core's (core/process.py); the queue's machinery is below.
    "core",
    "jobs",
    "db",
]
ignore_imports = [
    # A route is a leaf: it calls the services of any area, and only routing.py imports it.
    "server.core.routes.** -> server.**",
    "server.auth.router -> server.**",
    "server.workspaces.router -> server.**",
    "server.pipeline.routes.** -> server.**",
    "server.jobs.router -> server.**",
    "server.raw.router -> server.**",
    "server.kg.router -> server.**",
    # The construction's jobs are leaves too: only server/app.py installs them.
    "server.pipeline.jobs -> server.**",
    "server.conversations.routes -> server.**",
]
