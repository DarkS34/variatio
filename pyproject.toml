[project]
name = "variatio"
version = "1.185.35"
description = "Knowledge graph-guided generation of educational content variants"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "ollama>=0.4.7",
    "tqdm>=4.67.3",
    "json-repair>=0.59.5",
    "pydantic>=2.11.2",
]

[project.optional-dependencies]
# pypdfium2 and python-pptx arrive with Docling anyway, but `documents.page_images`
# imports the first to rasterise pages and `documents.office.speaker_notes` the second to
# read a deck's notes, so both are declared rather than relied on transitively.
builders = ["docling>=2.0.0", "pypdfium2>=4.30.0", "pillow>=10.0.0", "python-pptx>=1.0.0"]

# The web UI's backend. Kept out of the runtime so the CLI stays a plain library.

server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    # The evaluation's RAG arm reads the raw PDFs with a plain text extractor, deliberately not
    # the pipeline's VLM transcription: a baseline built without this system.
    "pypdf>=5.0.0",
    # An invitation's link is kept sealed (Fernet) so the panel can show it again, with a key
    # that never lives in the database: `server/auth/links.py`.
    "cryptography>=43.0.0",
]

# uv has no `default-extras`, so the extras are repeated here to keep a plain
# `uv sync` able to run the builders and the server locally.

[dependency-groups]
dev = [
    "docling>=2.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "python-pptx>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "pypdf>=5.0.0",
    "cryptography>=43.0.0",
    "pytest>=8.3.0",
    "import-linter>=2.1",
]

[project.scripts]
variatio = "variatio.cli:main"
system = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["variatio", "server"]

[tool.pytest.ini_options]
addopts = "-m 'not corpus and not model'"
markers = [
    "corpus: measures the built corpus cache; run with -m corpus after rebuilding the graph",
    "model: measures a judge against a live Ollama; run with -m model, it costs ~20 calls",
]

# The import boundaries, checked by `uv run lint-imports`. Each exception is an import that
# exists today and is named here so that no new one grows; removing one is always welcome.
[tool.importlinter]
root_packages = ["variatio", "server"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The library knows nothing of the server"
type = "forbidden"
source_modules = ["variatio"]
forbidden_modules = ["server"]

[[tool.importlinter.contracts]]
name = "The generation function imports no other function"
type = "forbidden"
source_modules = ["variatio.functionalities.generation", "server.functionalities.generation"]
forbidden_modules = [
    "variatio.functionalities.evaluation",
    "server.functionalities.evaluation",
    "variatio.functionalities.tutor",
    "server.functionalities.tutor",
    "variatio.functionalities.chat",
    "server.functionalities.chat",
]
# Direct imports only: a function reaches the library and the server, which reach others.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The evaluation function imports no other function"
type = "forbidden"
source_modules = ["variatio.functionalities.evaluation", "server.functionalities.evaluation"]
forbidden_modules = [
    "variatio.functionalities.generation",
    "server.functionalities.generation",
    "variatio.functionalities.tutor",
    "server.functionalities.tutor",
    "variatio.functionalities.chat",
    "server.functionalities.chat",
]
ignore_imports = [
    # The evaluation measures the generation: its `system` arm and its checks are the
    # generator's own.
    "variatio.functionalities.evaluation.** -> variatio.functionalities.generation.**",
]
# Direct imports only: a function reaches the library and the server, which reach others.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The tutor function imports no other function"
type = "forbidden"
source_modules = ["variatio.functionalities.tutor", "server.functionalities.tutor"]
forbidden_modules = [
    "variatio.functionalities.generation",
    "server.functionalities.generation",
    "variatio.functionalities.evaluation",
    "server.functionalities.evaluation",
    "variatio.functionalities.chat",
    "server.functionalities.chat",
]
# Direct imports only: a function reaches the library and the server, which reach others.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The chat function imports no other function"
type = "forbidden"
source_modules = ["variatio.functionalities.chat", "server.functionalities.chat"]
forbidden_modules = [
    "variatio.functionalities.generation",
    "server.functionalities.generation",
    "variatio.functionalities.evaluation",
    "server.functionalities.evaluation",
    "variatio.functionalities.tutor",
    "server.functionalities.tutor",
]
# Direct imports only: a function reaches the library and the server, which reach others.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Inside the library, a function imports only what the functions share"
type = "layers"
containers = ["variatio.functionalities"]
layers = [
    "generation | chat | tutor | evaluation",
    "shared",
]
ignore_imports = [
    # The settings registry reaches every function's settings; see «The library's layers».
    "variatio.settings.registry -> variatio.functionalities.*.settings",
    # The evaluation measures the generation; see «The evaluation function imports no other function».
    "variatio.functionalities.evaluation.** -> variatio.functionalities.generation.**",
    "variatio.functionalities.evaluation.** -> variatio.api",
    "variatio.functionalities.evaluation.** -> variatio.api.**",
]

[[tool.importlinter.contracts]]
name = "The library's layers"
type = "layers"
containers = ["variatio"]
layers = [
    "cli",
    "api",
    "functionalities",
    "exemplars_bank",
    "retrieval",
    "knowledge_graph",
    "documents",
    "prompts",
    "inference",
    "utils : settings : config",
]
ignore_imports = [
    "variatio.utils.lexicon -> variatio.prompts.wording",
    # The evaluation runs the whole system, as its `system` arm, through the door.
    "variatio.functionalities.evaluation.** -> variatio.api",
    "variatio.functionalities.evaluation.** -> variatio.api.**",
    # Each function declares its settings beside the code that reads them; the registry
    # picks them up by an optional import.
    "variatio.settings.registry -> variatio.functionalities.*.settings",
]

[[tool.importlinter.contracts]]
name = "Only the door and the work know what a workspace is"
type = "forbidden"
source_modules = [
    "variatio.functionalities.generation",
    "variatio.functionalities.shared",
    "variatio.retrieval",
    "variatio.exemplars_bank.tagging",
    "variatio.knowledge_graph.descriptions",
    "variatio.knowledge_graph.taggability",
    "variatio.prompts",
    "variatio.settings",
]
forbidden_modules = ["variatio.utils.workspace"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The vocabulary and the door never import the engine boundary"
type = "forbidden"
source_modules = [
    "variatio.api",
    "variatio.knowledge_graph.context",
    "variatio.knowledge_graph.graph",
    "variatio.knowledge_graph.relations",
    "variatio.exemplars_bank.exemplars_profile.profile",
    "variatio.prompts",
    "variatio.settings",
]
forbidden_modules = ["variatio.inference"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the local engine imports the Ollama SDK"
type = "forbidden"
source_modules = ["variatio", "server"]
forbidden_modules = ["ollama"]
ignore_imports = ["variatio.inference.ollama.engine -> ollama"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only server/routing.py imports a route module"
type = "protected"
# Every area keeps its routes in a `routes/` package; one route module importing another is
# the next contract's.
protected_modules = ["server.**.routes.*"]
allowed_importers = ["server.routing", "server.**.routes.*"]

[[tool.importlinter.contracts]]
name = "The server's route modules do not import each other"
type = "independence"
modules = ["server.**.routes.*"]

[[tool.importlinter.contracts]]
name = "The server's layers"
type = "layers"
containers = ["server"]
layers = [
    "__main__ : app : cli : routing",
    # The functions: only the composition root mounts them, and none imports another.
    "functionalities.generation | functionalities.chat | functionalities.tutor | functionalities.evaluation",
    "admin",
    "exemplars_bank | knowledge_graph | documents",
    # The bank shows an exercise to the class's groups, so the class sits below the steps.
    "classroom",
    "pipeline",
    "auth | workspaces",
    "functionalities.shared",
    # The process's live queue is the core's (core/process.py); the queue's machinery is below.
    "core",
    "jobs",
    "db",
]
ignore_imports = [
    # A route is a leaf: it calls the services of any area, and only routing.py imports it.
    "server.**.routes.** -> server.**",
    # The construction's jobs are leaves too: only server/app.py installs them.
    "server.pipeline.jobs -> server.**",
    "server.functionalities.shared.conversations.routes -> server.**",
]
