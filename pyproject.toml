[project]
name = "graph-guided-llm-content-generator"
version = "0.1.0"
description = "Knowledge graph-guided generation of educational content variants"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "ollama>=0.4.7",
    "scipy>=1.15.3",
    "tqdm>=4.67.3",
    "json-repair>=0.59.5",
    "pydantic>=2.11.2",
]

# Authoring-only. Docling drags ~540 MB (torch, transformers, docling-parse) that the
# runtime pipeline never touches; it is imported lazily in builders/_source_docs.py.

[project.optional-dependencies]
# pypdfium2 arrives with Docling anyway, but `_source_docs.page_images` imports it
# directly to rasterise pages, so it is declared rather than relied on transitively.
builders = ["docling>=2.0.0", "pypdfium2>=4.30.0", "pillow>=10.0.0"]

# The web UI's backend. Kept out of the runtime so the CLI stays a plain library.

server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
]

# uv has no `default-extras`, so the extras are repeated here to keep a plain
# `uv sync` able to run the builders and the server locally.

[dependency-groups]
dev = [
    "docling>=2.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "email-validator>=2.2.0",
    "pytest>=8.3.0",
]

[project.scripts]
variant-generator = "variant_generator.cli:main"
system = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["variant_generator", "server", "study"]

[tool.pytest.ini_options]
addopts = "-m 'not corpus'"
markers = [
    "corpus: measures the built corpus cache; run with -m corpus after rebuilding the graph",
]
