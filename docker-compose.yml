# Local development only: this file brings up the database the app expects and nothing
# else. The API and the worker keep running from the host with `uv run`, so a build still
# sees the GPU and Ollama on localhost without any container networking.
name: variatio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-variatio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-variatio}
      POSTGRES_DB: ${POSTGRES_DB:-variatio}
      # Deterministic collation, so an index built here behaves like the one on the VPS.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-variatio} -d ${POSTGRES_DB:-variatio}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
