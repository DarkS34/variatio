<!-- The mark's single-tone version, in the ink of the DARK palette: `primary`,
     oklch(0.95 0.004 265). Its twin `favicon.svg` is the same five shapes in the
     light one, and `theme.js` decides which of the two the tab carries. Edit them
     together, and keep the geometry the same as `ui/logo.tsx` — only the colour
     collapses to one tone here: fill against outline and the dotted stretch carry
     the frontier. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <path d="M6.6 12H9.7" stroke="#EDEEF1" stroke-width="1.6"/>
  <path d="M14.7 12H16.2" stroke="#EDEEF1" stroke-width="1.6" stroke-dasharray="0.5 0.5"/>
  <rect x="2" y="9.7" width="4.6" height="4.6" fill="#EDEEF1"/>
  <rect x="9.7" y="9.7" width="4.6" height="4.6" fill="#EDEEF1"/>
  <rect x="17.4" y="9.7" width="4.6" height="4.6" stroke="#EDEEF1" stroke-width="1.6"/>
</svg>
